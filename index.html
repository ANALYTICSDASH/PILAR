<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7BD01">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Del Pilar">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Tablero Del Pilar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --pilar:#F7BD01;--pilar-2:#E2A800;--pilar-suave:#FFF3C7;--carbon:#2A2A29;
  --bg:#F4F3EF;--surface:#FFFFFF;--surface-2:#F8F7F3;--line:#E3E0D7;--text:#2A2A29;--muted:#6B675F;
  --ink:#2A2A29;--ink-text:#FFFFFF;--bar:#D8D4C8;
  --ok:#2E7D4F;--ok-bg:#E2F1E7;--warn:#9A6500;--warn-bg:#FFF0C2;--bad:#B23A1C;--bad-bg:#FADFD6;--info:#2D6AA3;--info-bg:#E1ECF7;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#1C1C1B;--surface:#262625;--surface-2:#2E2E2C;--line:#3A3936;--text:#F2F0E9;--muted:#A9A59B;
  --pilar-suave:#3A3115;--ink:#F2F0E9;--ink-text:#1C1C1B;--bar:#4A4844;
  --ok:#72CF98;--ok-bg:#1E3327;--warn:#F2C14E;--warn-bg:#3A3015;--bad:#F08B6D;--bad-bg:#3D2219;--info:#82B4E6;--info-bg:#1C2B3A;color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pilar);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.12;letter-spacing:-.01em}
h1{font-size:clamp(26px,3.2vw,34px);font-weight:800}
h2{font-size:20px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0}
small{font-size:12.5px}
.muted{color:var(--muted)}
.num{text-align:right;font-variant-numeric:tabular-nums}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 22px;font-weight:650;cursor:pointer;background:var(--ink);color:var(--ink-text);text-decoration:none;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn:hover{filter:brightness(1.08)}
.btn-pilar{background:var(--pilar);color:var(--carbon)}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--text)}
.btn-ghost:hover{border-color:var(--text)}
.btn-ok{background:var(--ok);color:#fff}
.btn-sm{padding:8px 15px;font-size:14px}
.btn-full{width:100%}
.btn[disabled]{opacity:.5;cursor:default}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:999px;font-size:12.5px;font-weight:650;border:0;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.info{background:var(--info-bg);color:var(--info)}
.chip.neutral{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

/* Campos */
.fld{display:block;margin-bottom:14px}
.fld>span{display:block;font-size:13.5px;font-weight:600;margin-bottom:6px}
.fld input,.fld textarea,.sel{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface)}
.fld input:focus,.fld textarea:focus,.sel:focus{border-color:var(--text);outline:none}
.sel{width:auto;padding:8px 12px;cursor:pointer}
.err{color:var(--bad);font-size:14px;min-height:20px;margin:-4px 0 10px}

/* Login */
.login{display:grid;grid-template-columns:1.15fr 1fr;min-height:100vh}
.login-brand{background:var(--pilar);color:var(--carbon);padding:48px clamp(28px,5vw,72px);display:flex;flex-direction:column;justify-content:space-between;gap:40px}
.login-logo{width:min(340px,78%);height:auto}
.login-claim{font-family:var(--display);font-weight:800;font-size:clamp(30px,4.4vw,56px);line-height:1.04;max-width:13ch;letter-spacing:-.02em}
.login-foot{font-size:15px;max-width:40ch}
.login-side{display:flex;align-items:center;justify-content:center;padding:40px 24px}
.login-form{width:min(380px,100%)}
.login-form h2{font-size:24px;margin-bottom:22px}
.demo{margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}
.demo p{font-size:13px;color:var(--muted);margin-bottom:10px}
.demo-list{display:flex;flex-wrap:wrap;gap:8px}
.demo-list .chip{cursor:pointer;padding:6px 12px;font-size:13.5px}
.demo-list .chip small{font-weight:500;opacity:.8}
.chip-sel{appearance:auto;cursor:pointer;padding:6px 10px;font-size:13.5px;font-family:inherit}
@media (max-width:820px){
  .login{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .login-brand{padding:calc(28px + env(safe-area-inset-top)) 24px 30px;gap:22px}
  .login-logo{width:190px}
  .login-claim{font-size:32px}
  .login-side{align-items:flex-start;padding:28px 20px calc(28px + env(safe-area-inset-bottom))}
}

/* Bienvenida */
.welcome{background:var(--pilar);color:var(--carbon);min-height:100vh;display:flex;flex-direction:column;padding:calc(32px + env(safe-area-inset-top)) clamp(24px,6vw,88px) calc(36px + env(safe-area-inset-bottom))}
.welcome img{width:170px;height:auto}
.w-body{margin:auto 0;padding:36px 0}
.w-saludo{font-size:18px;font-weight:600}
.w-hola{font-family:var(--display);font-weight:800;font-size:clamp(64px,13vw,168px);line-height:.92;letter-spacing:-.035em;margin:8px 0 18px;animation:sube .7s cubic-bezier(.2,.8,.2,1) both}
.w-rol{font-size:16px;margin-bottom:30px}
.w-rol strong{font-weight:700}
.w-hechos{list-style:none;padding:0;margin:0 0 36px;display:grid;gap:12px;max-width:620px}
.w-hechos li{font-size:clamp(17px,1.8vw,20px);padding-left:20px;position:relative}
.w-hechos li::before{content:"";position:absolute;left:0;top:.6em;width:8px;height:8px;border-radius:50%;background:var(--carbon)}
.welcome .btn{background:var(--carbon);color:#fff;padding:15px 28px;font-size:16px}
@keyframes sube{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.w-hola{animation:none}}

/* Shell */
.shell{display:grid;grid-template-columns:232px 1fr;grid-template-rows:auto 1fr;min-height:100vh}
.topbar{grid-column:1/-1;background:var(--pilar);color:var(--carbon);display:flex;align-items:center;gap:16px;padding:0 22px;height:64px;position:sticky;top:0;z-index:20}
.brand{background:none;border:0;padding:0;cursor:pointer;display:flex}
.brand img{height:30px;width:auto}
.tb-title{font-weight:600;font-size:14.5px;padding-left:16px;border-left:1.5px solid rgba(42,42,41,.3)}
.tb-user{margin-left:auto;display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:50%;background:var(--carbon);color:var(--pilar);display:grid;place-items:center;font-family:var(--display);font-weight:800}
.tb-u{display:flex;flex-direction:column;line-height:1.2}
.tb-u small{opacity:.8}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:64px;height:calc(100vh - 64px);display:flex;flex-direction:column;gap:4px}
.nav-item{display:flex;gap:12px;align-items:center;width:100%;padding:10px 12px;border-radius:10px;border:0;background:none;cursor:pointer;color:var(--muted);text-align:left;font-weight:550}
.nav-item svg{width:20px;height:20px;flex:none}
.nav-item:hover{color:var(--text);background:var(--surface-2)}
.nav-item.on{background:var(--pilar-suave);color:var(--text);font-weight:700}
.nav-item.salir{margin-top:auto}
main{padding:28px clamp(16px,3vw,36px) 48px;width:100%;max-width:1320px;min-width:0}
.bnav{display:none}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .topbar{height:auto;min-height:56px;padding:env(safe-area-inset-top) 16px 0}
  .brand img{height:24px}
  .tb-title,.tb-u{display:none}
  .side{display:none}
  main{padding:20px 14px calc(96px + env(safe-area-inset-bottom))}
  .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:30}
  .bnav .nav-item{flex-direction:column;gap:3px;font-size:11.5px;padding:6px 2px;text-align:center;justify-content:center}
  .bnav .nav-item.on{background:none;color:var(--text)}
  .bnav .nav-item.on svg{color:var(--carbon);background:var(--pilar);border-radius:999px;padding:2px 12px;width:46px;box-sizing:content-box;margin:0 -10px}
}

/* Contenido */
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.ph p{color:var(--muted);margin-top:6px}
.ph-actions{display:flex;gap:8px;flex-wrap:wrap}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.toolbar label{font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.panel-h p{color:var(--muted);font-size:13.5px}
.stack{display:grid;gap:16px;align-content:start}
.two{display:grid;grid-template-columns:1.45fr 1fr;gap:16px}
@media (max-width:1000px){.two{grid-template-columns:1fr}}
@media (min-width:1100px){.grupos{grid-template-columns:1fr 1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.kpi .l{color:var(--muted);font-size:13.5px}
.kpi .v{font-family:var(--display);font-size:clamp(24px,2.4vw,30px);font-weight:700;line-height:1.15;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:13px;color:var(--muted)}
.kpi.lead{background:var(--carbon);border-color:var(--carbon);color:#fff}
.kpi.lead .l,.kpi.lead .s{color:rgba(255,255,255,.72)}
.kpi.lead .v{color:var(--pilar)}
.up{color:var(--ok)}.down{color:var(--bad)}
.bar{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--pilar);border-radius:99px}
.kpi.lead .up{color:#8EE0AE}.kpi.lead .down{color:#FF9F85}
.kpi.lead .bar{background:rgba(255,255,255,.12);border-color:transparent}
.chart{width:100%;height:auto;display:block}
.mix{display:grid;gap:12px}
.mix-row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:baseline}
.mix-row .bar{grid-column:1/-1}
.mix-row b{font-weight:650}
.mix-n{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);font-size:11.5px;font-weight:700;margin-right:8px;color:var(--muted)}
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-weight:600;padding:9px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap}
th.sort{cursor:pointer}th.sort:hover{color:var(--text)}
th.on{color:var(--text)}
td{padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
.mini{display:inline-block;width:70px;vertical-align:middle;margin-left:8px}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* Hub */
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:7px 16px;border-radius:999px;cursor:pointer;font-weight:650;color:var(--muted);font-size:14px}
.seg button.on{background:var(--ink);color:var(--ink-text)}
.heat td.c{font-size:13.5px}
.heat th:first-child,.heat td:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
tr.click:hover td:first-child{background:var(--surface-2)}
.heat td.up{background:var(--ok-bg)}
.heat td.down{background:var(--bad-bg)}
.heat td.fuerte{color:var(--bad);font-weight:700}
.heat td.hoy{color:var(--muted);font-style:italic}
.heat td.num.up:not(.c),.heat td.num.down:not(.c){background:none}
.plan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;align-items:start}
.ruta-card{display:grid;gap:12px}
.ruta-card.bloq{opacity:.85}
.rc-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.rc-h p{font-size:13.5px;margin-top:3px}
.rc-f{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13.5px}
.pps{display:grid;gap:8px}
.pp{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:10px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface)}
.pp-n{width:28px;height:28px;border-radius:50%;background:var(--pilar);color:var(--carbon);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:14px}
.pp-main{display:grid;gap:2px;min-width:0}
.pp-main small{color:var(--muted)}
.pp-campos{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.pp-b{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.pp-b input{width:64px;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface)}
.pp-d{flex:1;min-width:140px;padding:6px 9px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);font-size:14px}
.pp-b input:focus,.pp-d:focus{border-color:var(--text);outline:none}
.pp-acts{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.ib{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;display:grid;place-items:center;color:var(--text);padding:0}
.ib svg{width:16px;height:16px}
.ib[disabled]{opacity:.35;cursor:default}
.ib-sel{width:76px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);font-size:12.5px;padding:0 4px;cursor:pointer}
.pp-vacia{color:var(--muted);font-size:14px}
.pp-add{position:relative}
.pp-add .sel{width:100%;padding:10px 12px}
.sug{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-top:6px;overflow:hidden}
.sug:empty{display:none}
.sug button{display:flex;justify-content:space-between;gap:10px;width:100%;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer;text-align:left}
.sug button:last-child{border-bottom:0}
.sug button:hover,.sug button:focus{background:var(--pilar-suave)}
.sug small{color:var(--muted)}
.sug-vacio{padding:10px 12px;color:var(--muted);font-size:14px}
.warn-txt{color:var(--warn)}
.seg-rutas{display:flex;width:100%}
.seg-rutas button{flex:1}
.seg-rutas small{opacity:.7;font-weight:500}
@media (max-width:820px){.pp-acts{flex-direction:row;grid-column:1/-1;justify-content:flex-end}}
.prod-q{width:100%;max-width:360px;padding:9px 12px;margin-bottom:12px}
.mini-bar{height:5px;margin-top:5px;max-width:220px}
.nota-tbl{font-size:13px;margin-top:10px}
.heat td.hot1{background:var(--ok-bg)}
.heat td.hot2{background:var(--ok-bg);color:var(--ok);font-weight:700}
.heat td.cold1{background:var(--bad-bg)}
.heat td.cold2{background:var(--bad-bg);color:var(--bad);font-weight:700}
.mp-bar{height:5px;max-width:110px;margin:5px 0 0 auto}
.aging{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.aging i,.aging-in i{display:block;height:100%}
.aging-mini{display:block;max-width:200px;margin-top:5px;height:5px;border:0;background:none}
.aging-in{display:flex;height:5px;border-radius:99px;overflow:hidden;background:var(--surface-2)}
.ag0{background:var(--ok)}.ag1{background:var(--pilar)}.ag2{background:#E07A3F}.ag3{background:var(--bad)}
.cc-nom{max-width:320px;white-space:normal}
.cc-nom strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ag-ley{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.ag-ley div{display:grid;gap:2px}
.ag-ley span{font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.ag-ley span i{width:10px;height:10px;border-radius:3px;display:inline-block}
.ag-ley strong{font-family:var(--display);font-size:20px}
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.mod{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:24px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:210px;transition:border-color .15s}
.mod:hover{border-color:var(--text)}
.mod .ico{width:48px;height:48px;border-radius:14px;background:var(--pilar);display:grid;place-items:center;color:var(--carbon);margin-bottom:10px}
.mod .ico svg{width:24px;height:24px}
.mod p{color:var(--muted)}
.mod .live{margin-top:auto;padding-top:14px;font-weight:650;font-size:14.5px}
@media (max-width:820px){.mods{grid-template-columns:1fr 1fr;gap:10px}.mod{min-height:0;padding:16px;border-radius:16px}.mod p{display:none}.mod .ico{width:40px;height:40px;margin-bottom:4px}.mod h3{font-size:16px}.mod .live{font-size:13px;padding-top:6px;font-weight:600;color:var(--muted)}}
.hub-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;color:var(--muted);font-size:13.5px;flex-wrap:wrap}

/* Entregas */
.stops{display:grid;gap:12px}
.stop{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:16px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.stop.next{border-color:var(--pilar);box-shadow:0 0 0 3px var(--pilar-suave)}
.stop.done{opacity:.72}
.stop-n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;background:var(--surface-2);border:1.5px solid var(--line);grid-row:span 3}
.stop.next .stop-n{background:var(--pilar);border-color:var(--pilar);color:var(--carbon)}
.stop.done .stop-n{background:var(--ok-bg);border-color:var(--ok-bg);color:var(--ok)}
.stop-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.stop-meta{font-size:13.5px;color:var(--muted)}
.stop-det{font-size:14px}
.stop-acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.links{display:flex;gap:14px;flex-wrap:wrap;font-size:14px}
.links a{color:var(--text);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.ruta-row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ruta-row:last-child{border-bottom:0}

/* Relevamiento */
.vitrina{width:100%;max-width:640px;height:auto;display:block;margin:0 auto;user-select:none}
.vitrina .tray{cursor:pointer}
.vitrina .tray:hover rect.tb{stroke-width:3}
.vitrina.ro .tray{cursor:default}
.checks{display:grid;gap:8px}
.check{display:flex;gap:12px;align-items:center;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface)}
.check input{width:20px;height:20px;accent-color:var(--ok);flex:none}
.check.on{border-color:var(--ok);background:var(--ok-bg)}
.grupos{display:grid;max-width:100%;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px 24px}
.grupo-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.modal .grupos{grid-template-columns:1fr}
.foto-cargando{margin-top:10px;padding:28px;border:1.5px dashed var(--line);border-radius:10px;text-align:center;color:var(--muted);font-size:14px}
.foto-prev{max-width:100%;border-radius:10px;margin-top:10px;display:block}
.score{font-family:var(--display);font-weight:800}

/* Alertas */
.alert{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.alert:hover{border-color:var(--text)}
.alert .dot{width:12px;height:12px;border-radius:50%}
.alerta-g{display:grid;gap:8px;padding:16px}
.alerta-g .panel-h{margin-bottom:2px}
.alerta-g .alert{padding:10px 12px;border-radius:10px}
.nota{background:var(--pilar-suave);border-radius:12px;padding:12px 16px;font-size:14px;margin-bottom:18px}

/* Modal y aviso */
.modal-bg{position:fixed;inset:0;background:rgba(20,20,18,.55);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal{background:var(--surface);width:min(720px,100%);max-height:90vh;overflow:auto;border-radius:18px;padding:24px}
.modal-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.x{background:var(--surface-2);border:1px solid var(--line);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:20px;line-height:1;flex:none}
@media (max-width:820px){.modal-bg{align-items:flex-end;padding:0}.modal{border-radius:18px 18px 0 0;padding-bottom:calc(24px + env(safe-area-inset-bottom))}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--ink-text);padding:12px 20px;border-radius:12px;z-index:80;max-width:min(520px,92vw);font-size:14.5px}
@media (max-width:820px){.toast{bottom:calc(84px + env(safe-area-inset-bottom))}}
.opts{display:grid;gap:8px;margin-bottom:14px}
.opt{display:flex;gap:10px;align-items:center;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer}
.opt input{accent-color:var(--carbon)}
</style>
</head>

var LS = {
  get: function(k, d){ try{ var v = localStorage.getItem('dp_' + k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set: function(k, v){ try{ localStorage.setItem('dp_' + k, JSON.stringify(v)); return true; }catch(e){ return false; } },
  del: function(k){ try{ localStorage.removeItem('dp_' + k); }catch(e){} }
};
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function norm(s){ return String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,''); }

/* ---------- Capa de datos (mock o Apps Script) ---------- */
function jsonp(url, params, ms){
  return new Promise(function(res, rej){
    var cb = 'dpcb_' + Date.now() + Math.floor(Math.random()*1e5);
    var s = document.createElement('script');
    var t = setTimeout(function(){ fin(); rej(new Error('El servidor no respondió. Probá de nuevo en un rato.')); }, ms || 20000);
    function fin(){ clearTimeout(t); try{ delete window[cb]; }catch(e){ window[cb] = undefined; } s.remove(); }
    window[cb] = function(d){ fin(); res(d); };
    var q = new URLSearchParams(params); q.set('callback', cb);
    s.src = url + '?' + q.toString();
    s.onerror = function(){ fin(); rej(new Error('No hay conexión con el servidor.')); };
    document.head.appendChild(s);
  });
}

function sincronizar(){
  if (!CONFIG.API_URL || !navigator.onLine || sincronizando || !ST.user || !ST.user.token) return;
  var q = LS.get('pendientes', []);
  if (!q.length){ if (huboEnvios){ huboEnvios = false; refrescarDatos(); } return; }
  sincronizando = true;
  var item = q[0], tk = ST.user.token;
  var envio = item.post
    ? fetch(CONFIG.API_URL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'}, body:JSON.stringify({accion:item.accion, token:tk, data:item.data})}).then(function(){ return {ok:true}; })
    : jsonp(CONFIG.API_URL, {accion:item.accion, token:tk, data:JSON.stringify(item.data)});
  envio.then(function(r){

function barsSVG(vals, labels, hi){

/* Mix de productos ordenado de mayor a menor venta. Con muchas familias muestra las 10 primeras y un boton para ver el resto. */

      '<span class="num">' + fmtM(x.c.imp) + ' ' + (x.d == null ? '' : '<small class="' + (x.d >= 0 ? 'up' : 'down') + '">' + pct(x.d, true) + '</small>') + '</span>' +
      '<div class="bar"><i style="width:' + (x.c.imp / max * 100).toFixed(1) + '%"></i></div></div>';
  }).join('') + '</div>';

/* Variacion del mes a la fecha (dias completos) contra los mismos dias de la semana de hace 4 semanas */

  if (multi) h += '<label>Tipo <select class="sel" onchange="setDash(\'tipo\',this.value)">' + tiposDisp().map(function(z){ return '<option value="' + z + '"' + (z === D.tipo ? ' selected' : '') + '>' + (TIPO_TXT[z] || z) + '</option>'; }).join('') + '</select></label>';
  return h;
}
function vDash(){

    '<label class="btn btn-sm" tabindex="0" title="Sube las metas del Excel. Las ventas no se tocan: vienen de Pixo">' + IC.subir + 'Cargar metas<input type="file" accept=".xlsx,.xls,.csv" hidden onchange="onExcel(this.files[0]);this.value=\'\'"></label></div>';

  h += '<div class="toolbar">' + segVista() + '<label>Mes <select class="sel" onchange="setDash(\'mes\',this.value)">' +
    meses.slice().reverse().map(function(m){ return '<option value="' + m + '"' + (m === D.mes ? ' selected' : '') + '>' + mesLargo(m) + '</option>'; }).join('') + '</select></label>';
  h += filtrosBocas(u, multi) + '</div>';

  if (!bs.length) return h + '<div class="panel empty">No hay bocas con estos filtros. Cambiá la zona o el tipo para ver datos.</div>';

  var extraCump = cump == null ? '' : '<div class="bar" style="margin-top:8px"><i style="width:' + Math.min(cump,100).toFixed(1) + '%"></i></div>';
  h += '<div class="kpis">' +
    kpi('Venta de ' + mesNombre(D.mes), fmtM(cur.imp), (parcial && vr == null ? 'Mes en curso' : deltaHTML(vr, refTxt)), 'lead') +
    kpi('Cumplimiento de meta', cump == null ? '-' : pct(cump), meta ? 'Meta ' + fmtM(meta) : 'Sin meta cargada', '', extraCump) +
    (kpiTicket(set, D.mes, prev, D.tipo === 'Planta' ? 'Factura promedio' : null) || kpi('Unidades', nf.format(cur.uni), ant ? nf.format(ant.uni) + ' en ' + mesNombre(prev) : ''));

    barsSVG(meses.map(function(m){ return venta(set, m).imp; }), meses.map(mesCorto), i) + '</section>' +
    '<section class="panel"><div class="panel-h"><h2>Mix de productos</h2><p>' + (parcial ? 'De mayor a menor, mes en curso' : 'De mayor a menor en ' + mesNombre(D.mes)) + '</p></div>' + mixHTML(set, D.mes, parcial ? null : prev) + '</section></div>';

    filas.forEach(function(f){ var x = tkMes(new Set([f.b.id]), D.mes); f.tk = x.prom; if (x.prom) hayTk = true; });
    if (parcial) filas.forEach(function(f){ f.vr = mtdVar(new Set([f.b.id])); });
    var o = D.orden; filas.sort(function(a,b){ var x = a[o] == null ? -1e9 : a[o], y = b[o] == null ? -1e9 : b[o]; return y - x; });
    var th = function(k, t, cls){ return '<th class="sort' + (cls ? ' ' + cls : '') + (o === k ? ' on' : '') + '" onclick="setDash(\'orden\',\'' + k + '\')">' + t + (o === k ? ' ▾' : '') + '</th>'; };
    h += '<section class="panel" style="margin-top:16px"><div class="panel-h"><h2>Ranking de bocas</h2><p>Tocá una boca para ver su detalle</p></div><div class="tbl-wrap"><table><thead><tr><th>#</th><th>Boca</th><th>Zona</th><th>Tipo</th>' +
      th('imp','Venta','num') + th('vr', parcial ? 'Var. vs 4 sem.' : 'Var. mes ant.', 'num') + (hayTk ? th('tk','Ticket prom.','num') : '') + th('cump','Meta','num') + '</tr></thead><tbody>' +
      filas.map(function(f, k){
        var cc = f.cump == null ? 'neutral' : f.cump >= 100 ? 'ok' : f.cump >= 90 ? 'warn' : 'bad';
        return '<tr class="click" onclick="verBoca(\'' + f.b.id + '\')"><td class="muted">' + (k+1) + '</td><td><strong>' + esc(f.b.nombre) + '</strong></td><td>' + f.b.zona + '</td><td>' + f.b.tipo + '</td>' +
          '<td class="num">' + fmt$(f.imp) + '</td><td class="num ' + (f.vr == null ? '' : f.vr >= 0 ? 'up' : 'down') + '">' + pct(f.vr, true) + '</td>' +
          (hayTk ? '<td class="num">' + (f.tk ? fmt$(f.tk) : '-') + '</td>' : '') + '<td class="num"><span class="chip ' + cc + '">' + pct(f.cump) + '</span></td></tr>';
      }).join('') + '</tbody></table></div></section>';

}
function barrasDia(vals, fechas){
  var W = angosto() ? 380 : 700, H = 240, pl = 6, pr = 6, n = vals.length, max = Math.max.apply(null, vals.concat([1])), bw = (W - pl - pr) / n, g = '';
  var uid = 'ry' + Math.floor(Math.random()*1e6);
  var comp = vals.slice(0, -1), prom = comp.reduce(function(a, b){ return a + b; }, 0) / (comp.length || 1), yp = H - 44 - (H - 74) * prom / max;
  g += '<defs><pattern id="' + uid + '" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--pilar-suave)"/><rect width="3" height="6" fill="var(--pilar)"/></pattern></defs>';
  vals.forEach(function(v, i){
    var h = (H - 74) * v / max, x = pl + i*bw + bw*0.14, w = bw*0.72, y = H - 44 - h, f = fechas[i], wd = dowDe(f), last = i === n - 1;
    var fill = last ? 'url(#' + uid + ')' : (wd === 0 || wd === 6 ? 'var(--pilar-2)' : 'var(--bar)');
    g += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + Math.max(h, 1).toFixed(1) + '" rx="4" fill="' + fill + '"' + (last ? ' stroke="var(--pilar-2)" stroke-width="1.5"' : '') + '><title>' + DOWL[wd] + ' ' + (+f.slice(8)) + '/' + (+f.slice(5,7)) + ': ' + fmt$(v) + (last ? ' (parcial)' : '') + '</title></rect>';
    g += '<text x="' + (x + w/2).toFixed(1) + '" y="' + (H - 28) + '" text-anchor="middle" font-size="11" fill="var(--' + (last ? 'text' : 'muted') + ')"' + (last ? ' font-weight="700"' : '') + '>' + (+f.slice(8)) + '</text>';
    if (wd === 1) g += '<text x="' + (x + w/2).toFixed(1) + '" y="' + (H - 12) + '" text-anchor="middle" font-size="10.5" fill="var(--muted)">Lun</text>';
  });
  g += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + yp.toFixed(1) + '" y2="' + yp.toFixed(1) + '" stroke="var(--text)" stroke-dasharray="4 4" opacity=".4"/>';
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Venta por día">' + g + '</svg>' +
    '<div class="legend"><span><i style="background:none;border-top:2px dashed var(--muted);border-radius:0;height:0;width:14px"></i>Promedio ' + fmtM(prom) + '</span><span><i style="background:var(--bar)"></i>Lunes a viernes</span><span><i style="background:var(--pilar-2)"></i>Fin de semana</span><span><i style="background:var(--pilar)"></i>Hoy, parcial</span></div>';
}
function patronSemana(set){

  for (var k = -28; k <= -1; k++){ var f = diaMas(k), wd = dowDe(f); tot[wd] += diaVenta(set, f); cnt[wd]++; }
  var orden = [1,2,3,4,5,6,0], vals = orden.map(function(wd){ return cnt[wd] ? tot[wd] / cnt[wd] : 0; });
  var hi = vals.indexOf(Math.max.apply(null, vals));
  return {html:barsSVG(vals, orden.map(function(wd){ return DOW[wd]; }), hi), mejor:DOWL[orden[hi]], peor:DOWL[orden[vals.indexOf(Math.min.apply(null, vals))]]};
}
function vDashDiario(u, todas, multi){

        return '<td class="num c ' + cls + '" title="' + (c === 0 ? 'Parcial' : pct(vr, true) + ' contra el ' + DOWL[dowDe(diaMas(c))] + ' anterior') + '">' + fmtM(v).replace('$ ', '') + '</td>';
      }).join('') + '<td class="num"><strong>' + fmtM(fl.t) + '</strong></td><td class="num ' + (fl.vr == null ? '' : fl.vr >= 0 ? 'up' : 'down') + '">' + pct(fl.vr, true) + '</td></tr>';

/* ---- Carga de la sabana (boton CARGAR EXCEL) ---- */
function cargarXLSX(){
  if (window.XLSX) return Promise.resolve();
  return new Promise(function(res, rej){
    var s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = res; s.onerror = function(){ rej(new Error('No se pudo cargar el lector de Excel. Revisá la conexión a internet.')); };
    document.head.appendChild(s);
  });
}
function parseMes(v){
  if (v == null || v === '') return null;
  if (typeof v === 'number' && v > 20000){ var d = new Date(Math.round((v - 25569) * 864e5)); return d.getUTCFullYear() + '-' + String(d.getUTCMonth()+1).padStart(2,'0'); }
  var s = String(v).trim(), m;
  if ((m = s.match(/^(\d{4})[-\/](\d{1,2})/))) return m[1] + '-' + m[2].padStart(2,'0');
  if ((m = s.match(/^(\d{1,2})[-\/](\d{4})$/))) return m[2] + '-' + m[1].padStart(2,'0');
  if ((m = s.match(/^\d{1,2}[-\/](\d{1,2})[-\/](\d{4})/))) return m[2] + '-' + m[1].padStart(2,'0');
  return null;
}
function filasHoja(wb, nombre, primera){

function onExcel(file){
  if (!file) return;
  toast('Leyendo ' + esc(file.name) + '...', 6000);
  cargarXLSX().then(function(){ return file.arrayBuffer(); }).then(function(buf){
    var wb = XLSX.read(buf, {type:'array'});
    var mapa = {}; BOCAS.forEach(function(b){ mapa[norm(b.id)] = b.id; mapa[norm(b.nombre)] = b.id; });
    var metas = [], sinBoca = {}, malas = 0, vistos = {};
    filasHoja(wb, 'METAS', true).forEach(function(r){
      var b = mapa[norm(r.boca)] || mapa[norm(r.local)], m = parseMes(r.mes), v = r.meta;
      if (r.boca === '' && r.local === '' && v === '') return;
      if (!b){ if (r.boca || r.local) sinBoca[r.boca || r.local] = 1; return; }
      if (v === '' || v == null) return;                    // meta vacia: no se toca
      v = typeof v === 'number' ? v : Number(String(v).replace(/[$\s.]/g, '').replace(',', '.'));
      if (!m || !isFinite(v) || v < 0){ malas++; return; }
      vistos[b + '|' + m] = metas.length; metas.push({boca:b, mes:m, meta:Math.round(v)});
    });
    var unicas = Object.keys(vistos).map(function(k){ return metas[vistos[k]]; });
    if (!unicas.length) throw new Error('No encontré metas para cargar. La hoja METAS necesita las columnas BOCA, MES y META, con al menos una meta completa.');
    var meses = {}; unicas.forEach(function(x){ meses[x.mes] = 1; });
    var fin = function(){
      unicas.forEach(function(x){ DATA.metas[x.boca + '|' + x.mes] = x.meta; });
      LS.set('metas', DATA.metas); render();
      var nb = Object.keys(sinBoca), msg = 'Listo: ' + unicas.length + (unicas.length === 1 ? ' meta' : ' metas') + ' de ' + Object.keys(meses).sort().map(mesLargo).join(', ') + '.';
      if (nb.length) msg += ' No reconocí: ' + nb.slice(0, 3).map(esc).join(', ') + (nb.length > 3 ? ' y ' + (nb.length - 3) + ' más' : '') + '.';
      if (malas) msg += ' ' + malas + (malas === 1 ? ' fila tenía' : ' filas tenían') + ' el mes o la meta mal escritos y quedaron afuera.';
      toast(msg, 8000);
    };
    if (!CONFIG.API_URL){ fin(); return; }
    return apiPost('cargarMetas', {metas:unicas}).then(function(r){ if (!r.ok) throw new Error(r.error); fin(); });
  }).catch(function(e){ toast(e.message, 7000); });
}

function generarEntregas(){
  var r = rng(Number(hoyISO().replace(/-/g,'')) % 100000 + 3), out = [];
  var avance = {R1:[2,1,0], R2:[2,1,0], R3:[1,0,0], R4:[1,0,1]};
  Object.keys(RUTAS).forEach(function(rk){
    var R = RUTAS[rk], hh = Number(R.sale.slice(0,2)), mm = Number(R.sale.slice(3)) + 25, av = avance[rk];
    R.paradas.forEach(function(id, k){
      var d = destinoPorId(id), esBoca = !!bocaPorId(id);
      mm += 20 + Math.round(r()*20); hh += Math.floor(mm/60); mm = mm % 60;
      var med = 20 + Math.round(r()*40), cri = 10 + Math.round(r()*30), pan = 15 + Math.round(r()*35);
      var estado = k < av[0] ? 'entregado' : k < av[0] + av[1] ? 'camino' : (av[2] && k === av[0]) ? 'novedad' : 'pendiente';
      out.push({id:rk + '-' + (k+1), ruta:rk, chofer:R.chofer, orden:k+1, destino:id, nombre:d.nombre, tipo:esBoca ? 'Boca' : d.tipo,

/* Telefono argentino a formato WhatsApp (549 + caracteristica + numero). Vacio si no hay un numero valido. */
function telWA(t){
  var d = String(t || '').replace(/\D/g, '');
  if (!d) return '';
  if (d.indexOf('549') === 0) return d.length >= 12 ? d : '';
  if (d.indexOf('54') === 0) d = d.slice(2);
  if (d.charAt(0) === '0') d = d.slice(1);
  if (d.length === 12){ for (var k = 4; k >= 2; k--) if (d.substr(k, 2) === '15'){ d = d.slice(0, k) + d.slice(k + 2); break; } } // saca el 15: 351 15 5551234
  return d.length === 10 ? '549' + d : '';
}

function mapaSVG(L){
  var W = 640, H = 380, p = 30;
  L = L.filter(function(x){ return isFinite(x.lat) && isFinite(x.lng) && x.lat && x.lng; });
  if (!L.length) return '<p class="empty">Los destinos de hoy no tienen coordenadas cargadas.</p>';
  var lats = L.map(function(x){ return x.lat; }), lngs = L.map(function(x){ return x.lng; });
  var a = Math.min.apply(null, lats), b = Math.max.apply(null, lats), c = Math.min.apply(null, lngs), d = Math.max.apply(null, lngs);
  var sx = (W - 2*p) / ((d - c) || 1), sy = (H - 2*p) / ((b - a) || 1), s = Math.min(sx, sy);
  var ox = (W - (d - c)*s)/2, oy = (H - (b - a)*s)/2;
  var X = function(lng){ return ox + (lng - c)*s; }, Y = function(lat){ return oy + (b - lat)*s; };
  var g = '<rect x="0" y="0" width="' + W + '" height="' + H + '" rx="12" fill="var(--surface-2)"/>';
  Object.keys(RUTAS).forEach(function(rk){
    var pts = L.filter(function(x){ return x.ruta === rk; }).sort(function(m,n){ return m.orden - n.orden; });
    if (pts.length > 1) g += '<polyline fill="none" stroke="var(--bar)" stroke-width="2" stroke-dasharray="5 5" points="' + pts.map(function(x){ return X(x.lng).toFixed(1) + ',' + Y(x.lat).toFixed(1); }).join(' ') + '"/>';
  });
  L.forEach(function(x){
    g += '<g><circle cx="' + X(x.lng).toFixed(1) + '" cy="' + Y(x.lat).toFixed(1) + '" r="8" fill="' + ESTADO_COLOR[x.estado] + '" stroke="var(--surface)" stroke-width="2.5"><title>' + esc(x.nombre) + ', ' + ESTADO[x.estado][0] + ' (ruta ' + x.ruta + ')</title></circle></g>';
  });
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Mapa de entregas">' + g + '</svg>' +
    '<div class="legend">' + Object.keys(ESTADO).map(function(k){ return '<span><i style="background:' + ESTADO_COLOR[k] + '"></i>' + ESTADO[k][0] + '</span>'; }).join('') + '</div>';
}

    }).join('') + '</section></div>';
  h += '<section class="panel" style="margin-top:16px"><div class="panel-h"><h2>Detalle de entregas</h2></div><div class="tbl-wrap"><table><thead><tr><th>Ruta</th><th>#</th><th>Destino</th><th>Tipo</th><th>Hora</th><th class="num">Bultos</th><th>Estado</th><th>Observación</th></tr></thead><tbody>' +

    }).join('') + '</tbody></table></div></section>';
  return h;

var CC = {q:'', orden:'saldo', lim:25};
var CC_TRAMOS = [['0 a 30 días',30,'ok'],['31 a 60 días',60,'warn'],['61 a 90 días',90,'bad'],['Más de 90 días',1e9,'bad2']];
function fechaCC(v){
  if (typeof v === 'number' && v > 20000){ var d = new Date(Math.round((v - 25569) * 864e5)); return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth()+1) + '-' + pad2(d.getUTCDate()); }
  var m = String(v || '').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if (m) return m[3] + '-' + pad2(m[2]) + '-' + pad2(m[1]);
  m = String(v || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[0] : '';
}
function diasEntre(a, b){ return Math.round((fechaDe(b) - fechaDe(a)) / 864e5); }
function ccPuedeCargar(u){ return u.admin || u.perfil === 'gerencial' || u.area === 'Administración'; }
/* Calcula por cliente: saldo, deuda por antiguedad (facturas abiertas, las mas viejas se cancelan primero), factura mas vieja abierta y ultimo pago */
function ccResumen(){
  var D = DATA.ctacte; if (!D) return null;
  if (D._res) return D._res;
  var ref = D.meta && D.meta.fecha ? D.meta.fecha.slice(0, 10) : hoyISO(), porCli = {};
  D.movs.forEach(function(m){ (porCli[m.id] = porCli[m.id] || []).push(m); });
  var tot = {saldo:0, tramos:[0,0,0,0], deudores:0, aFavor:0};
  var clientes = D.clientes.map(function(c){
    var mv = (porCli[c.id] || []).slice(), tramos = [0,0,0,0], vieja = null, pago = null, subs = {};
    mv.forEach(function(m){ subs[m.sub] = 1; if (m.haber > 0 && /caja/i.test(m.origen) && (!pago || m.fecha > pago)) pago = m.fecha; });
    var resto = c.saldo;
    if (resto > 0){
      mv.filter(function(m){ return m.debe > 0; }).sort(function(a, b){ return a.fecha < b.fecha ? 1 : a.fecha > b.fecha ? -1 : 0; }).forEach(function(m){
        if (resto <= 0.5) return;
        var abierto = Math.min(resto, m.debe); resto -= abierto;
        var dias = diasEntre(m.fecha, ref), k = dias <= 30 ? 0 : dias <= 60 ? 1 : dias <= 90 ? 2 : 3;
        tramos[k] += abierto; if (!vieja || m.fecha < vieja) vieja = m.fecha;
      });
      if (resto > 0.5) tramos[3] += resto;   // saldo sin facturas que lo expliquen: se toma como el mas viejo
    }
    tot.saldo += c.saldo; if (c.saldo > 0.5) tot.deudores++; else if (c.saldo < -0.5) tot.aFavor++;
    tramos.forEach(function(v, k){ tot.tramos[k] += v; });
    return {id:c.id, razon:c.razon, saldo:c.saldo, tramos:tramos, vieja:vieja, diasVieja:vieja ? diasEntre(vieja, ref) : null, pago:pago, subs:Object.keys(subs).length, movs:mv};
  });
  D._res = {ref:ref, tot:tot, clientes:clientes};
  return D._res;
}

/* ---- Carga del Excel ---- */
function onExcelCC(file){
  if (!file) return;
  toast('Leyendo ' + esc(file.name) + '...', 6000);
  cargarXLSX().then(function(){ return file.arrayBuffer(); }).then(function(buf){
    var wb = XLSX.read(buf, {type:'array'});
    var filas = filasHoja(wb, '', true);
    if (!filas.length || !('cliprv' in filas[0]) || !('saldo' in filas[0])) throw new Error('Este archivo no parece el reporte de saldos: tiene que tener las columnas cliprv, razonsocial, fecha, cbte, debe, haber y saldo.');
    var movs = [], saldos = {}, razones = {}, orden = [];
    filas.forEach(function(r){
      var id = String(r.cliprv).trim(), cbte = String(r.cbte || '').trim();
      if (!id || /^TOTALES/i.test(cbte)) return;
      if (!(id in razones)){ orden.push(id); razones[id] = String(r.razonsocial || '').trim(); }
      var saldo = Number(r.saldo) || 0;
      if (/^Saldo a la fecha/i.test(cbte)){ saldos[id] = saldo; return; }
      movs.push({id:id, sub:String(r.subcta || '').trim(), razon:razones[id], fecha:fechaCC(r.fecha), cbte:cbte, debe:Number(r.debe) || 0, haber:Number(r.haber) || 0, saldo:saldo, det:String(r.detalle || '').trim(), origen:String(r.tipoorigen || '').trim()});
    });
    if (!orden.length) throw new Error('No encontré clientes en el archivo.');
    var ultimo = {}; movs.forEach(function(m){ ultimo[m.id] = m.saldo; });
    var clientes = orden.map(function(id){ return {id:id, razon:razones[id], saldo:Math.round(((id in saldos) ? saldos[id] : (ultimo[id] || 0)) * 100) / 100}; });
    var data = {archivo:file.name, clientes:clientes, movs:movs};
    var fin = function(meta){
      DATA.ctacte = {meta:meta, clientes:clientes, movs:movs};
      LS.set('ctacte', DATA.ctacte); render();
      var t = clientes.reduce(function(s, c){ return s + c.saldo; }, 0);
      toast('Listo: ' + clientes.length + ' clientes y ' + movs.length + ' movimientos. Saldo total ' + fmtM(t) + '.', 7000);
    };
    if (!CONFIG.API_URL){ fin({archivo:file.name, fecha:new Date().toISOString(), usuario:ST.user.nombre, clientes:clientes.length}); return; }
    toast('Subiendo ' + clientes.length + ' clientes...', 8000);
    return apiPost('cargarCuentas', data).then(function(r){ if (!r.ok) throw new Error(r.error); fin(r.meta); });
  }).catch(function(e){ toast(e.message, 8000); });
}

function onExcelMP(file){
  if (!file) return;
  toast('Leyendo ' + esc(file.name) + '...', 6000);
  cargarXLSX().then(function(){ return file.arrayBuffer(); }).then(function(buf){
    var wb = XLSX.read(buf, {type:'array'}), filas = filasHoja(wb, 'MATERIAS_PRIMAS', true);
    if (!filas.length || !('producto' in filas[0]) || !('stock' in filas[0])) throw new Error('No encontré las columnas PRODUCTO y STOCK. Usá la plantilla de materias primas.');
    var items = [], malas = [], vistos = {};
    filas.forEach(function(r, i){
      var prod = String(r.producto || '').trim(); if (!prod) return;
      var st = numMP(r.stock), mn = numMP(r.minimo);
      if (st == null){ malas.push(prod); return; }
      var cod = String(r.codigo || '').trim(), k = norm(cod || prod);
      if (vistos[k] != null) items.splice(vistos[k], 1, null);
      vistos[k] = items.length;
      items.push({cod:cod, prod:prod, tipo:String(r.tipo || '').trim(), cat:String(r.categoria || '').trim(), uni:String(r.unidad || '').trim(), stock:st, min:mn, rep:fechaCC(r.ultimareposicion), prov:String(r.proveedor || '').trim()});
    });
    items = items.filter(Boolean);
    if (!items.length) throw new Error('El archivo no tiene productos con stock cargado.');
    var fin = function(meta){
      DATA.mp = {meta:meta, items:items}; LS.set('mp', DATA.mp); render();
      var bajo = items.filter(function(x){ return mpEstado(x).k < 2; }).length;
      toast('Listo: ' + items.length + ' productos, ' + bajo + ' para reponer.' + (malas.length ? ' Sin stock válido, quedaron afuera: ' + malas.slice(0, 3).map(esc).join(', ') + (malas.length > 3 ? ' y ' + (malas.length - 3) + ' más' : '') + '.' : ''), 8000);
    };
    if (!CONFIG.API_URL){ fin({archivo:file.name, fecha:new Date().toISOString(), usuario:ST.user.nombre}); return; }
    return apiPost('cargarMateriasPrimas', {archivo:file.name, items:items}).then(function(r){ if (!r.ok) throw new Error(r.error); fin(r.meta); });
  }).catch(function(e){ toast(e.message, 8000); });
}

/* ==========================================================
   MODULO D: ALERTAS
   Reglas comparables: el mes en curso se compara contra los MISMOS dias del mes anterior,

  mesAlta: -0.15, mesMedia: -0.08,   // mes a la fecha contra los mismos dias de la semana de hace 4 semanas

  famCaida: -0.20, famPeso: 0.05,    // familia que cae 20% y pesa al menos 5% de la boca (meses cerrados)

  var completos = +hoy.slice(8) - 1, diasMesAnt = new Date(+mesAnt.slice(0,4), +mesAnt.slice(5,7), 0).getDate();

          '<span>' + esc(a.txt) + '</span><span class="chip neutral">' + MOD[a.mod].c + '</span></button>';
      }).join('') + '</section>';
  }).join('') + '</div>';
  if (grupos.length > lim) h += '<div style="text-align:center;margin-top:16px"><button class="btn btn-ghost btn-sm" onclick="setAlertas(\'limite\',' + (lim + 12) + ')">Ver ' + Math.min(12, grupos.length - lim) + ' locales más (quedan ' + (grupos.length - lim) + ')</button></div>';
  return h;
}

/* ---------- Inicio ---------- */
(function init(){
  var ses = LS.get('sesion', null);
  if (ses){ ST.user = ses; ST.screen = LS.get('pantalla', 'hub'); if (ST.screen === 'login' || ST.screen === 'bienvenida') ST.screen = 'hub'; }
  if (CONFIG.API_URL){ var bl = LS.get('bocas', null); if (bl && bl.length) BOCAS = bl; }
  if (CONFIG.API_URL){ var rt = LS.get('rutas', null); if (rt) RUTAS = rt; }
  render(); sincronizar(); refrescarDatos();
  setInterval(function(){
    if (!ST.user || document.hidden || document.querySelector('.modal-bg')) return;
    if (['hub','entregas','alertas'].indexOf(ST.screen) >= 0) refrescarDatos();
    sincronizar();
  }, 90000);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden){ sincronizar(); if (ST.user && ST.screen !== 'relev') refrescarDatos(); } });
})();
</script>
